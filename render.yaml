services:
  - type: web
    name: ai-resume-screening-backend
    env: python
    plan: starter
    runtime: python3.11.9
    healthCheckPath: /api/health
    buildCommand: pip install -r requirements.txt && python -m spacy download en_core_web_sm
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: RESUME_DIR
        value: /var/data/resumes
      - key: JOB_DIR
        value: /var/data/jobs
      - key: CORS_ORIGINS
        sync: false
      - key: SENTENCE_TRANSFORMER_MODEL
        value: all-MiniLM-L6-v2
      - key: SPACY_MODEL
        value: en_core_web_sm
      - key: TRANSFORMERS_NO_TF
        value: "1"
      - key: TF_ENABLE_ONEDNN_OPTS
        value: "0"
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
    disk:
      name: resume-data
      mountPath: /var/data
      sizeGB: 1
